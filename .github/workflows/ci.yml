name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Same URL as .env.example: the Supabase CLI serves Postgres on 54322.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check
      - name: ruff format
        run: uv run ruff format --check
      - name: pyright
        run: uv run pyright
      - name: lint-imports
        run: uv run lint-imports
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: supabase db start
        run: supabase db start
      - name: alembic upgrade head
        run: uv run alembic upgrade head
      - name: alembic check
        run: uv run alembic check
      - name: alembic single head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      # Includes the integration tests, which need the database above.
      - name: pytest
        run: uv run pytest

  # infra/ is applied by hand (docs/deploy.md); CI only checks that it is formatted and
  # valid, without a backend or AWS credentials.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive
      - name: terraform init
        run: terraform -chdir=infra init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=infra validate
